---
on:
  push:
    tags: ["v*"]


jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"


      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"


      - name: Restore signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in android/keystore.enc -out /tmp/github-release.keystore \
            -pass pass:"$KEYSTORE_PASSWORD"
          echo "01f4e8ff1cd26c1eb7b99c3675a9c4f99fd462621564f53205a356280227e4f4  /tmp/github-release.keystore" | sha256sum -c -
          keytool -list -keystore /tmp/github-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS"


      - name: Build signed github APK
        working-directory: android
        env:
          GITHUB_KEYSTORE_PATH: /tmp/github-release.keystore
          GITHUB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GITHUB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITHUB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleGithubRelease --no-daemon


      - name: Prepare release files
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK_SRC="android/app/build/outputs/apk/github/release/app-github-release.apk"
          APK_NAME="apex-argus-${TAG}.apk"
          cp "$APK_SRC" "$APK_NAME"
          VCODE=$(grep -E '^\s*versionCode = ' android/app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          VNAME="${TAG#v}"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://github.com/sajidkabir/apex-argus/releases/download/%s/%s"}' \
            "$VCODE" "$VNAME" "$TAG" "$APK_NAME" > version.json
          cat version.json
          echo


      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apex-argus-*.apk
            version.json
          generate_release_notes: true
---
